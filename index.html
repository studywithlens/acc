<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lens">
<meta name="theme-color" content="#F7F4ED">
<title>Lens — سبورة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#33475A; --acc:#8FAFC6; --acci:#5D8AA8; --ink:#2A3742;
  --line:#A79C8A; --hair:#E1D8C9; --thead:#F2EDE3; --tint:#F7F4ED;
  --mute:#8A8377; --paper:#FFFFFF;
  --serif:'Latin Modern Roman','Computer Modern Serif',Georgia,'Times New Roman',serif;
  --ar:'Cairo','Segoe UI',Tahoma,'DejaVu Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{
  background:var(--tint); color:var(--pri); font-family:var(--ar);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- chrome ---------- */
.bar{
  flex:none; display:flex; align-items:center; gap:14px;
  padding:7px 14px; background:var(--tint);
  border-bottom:1px solid var(--hair); flex-wrap:wrap;
  transition:transform .22s ease, opacity .22s ease;
}
body.present .bar{ transform:translateY(-100%); opacity:0; pointer-events:none; position:absolute }
.grp{ display:flex; align-items:center; gap:8px }
.grp + .grp{ padding-inline-start:18px; border-inline-start:1px solid var(--hair) }
.lab{ font-family:var(--ar); font-size:9.5px; letter-spacing:2.2px; color:var(--mute); text-transform:uppercase;
  margin-inline-end:4px; user-select:none }

button{
  font-family:var(--ar); font-weight:400; font-size:13px; color:var(--pri);
  background:transparent; border:1px solid transparent; border-radius:2px;
  padding:9px 12px; cursor:pointer; line-height:1; min-height:38px;
  touch-action:manipulation;
}
button:hover{ background:#EFE9DC }
button:focus-visible{ outline:2px solid var(--acci); outline-offset:1px }
button[aria-pressed="true"]{ background:#fff; border-color:var(--hair); color:var(--pri) }
button:disabled{ opacity:.35; cursor:default }
button:disabled:hover{ background:transparent }

.sw{ flex:none; width:30px; height:30px; min-height:0; padding:0; border-radius:50%;
  border:1px solid var(--hair); aspect-ratio:1 }
.sw[aria-pressed="true"]{ box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--acci); border-color:transparent }
.nib{ flex:none; width:40px; height:38px; min-height:0; padding:0; display:grid; place-items:center }
.nib i{ display:block; flex:none; background:var(--pri); border-radius:50% }

select{
  font-family:var(--ar); font-size:14px; min-height:38px; color:var(--pri); background:#fff;
  border:1px solid var(--hair); border-radius:2px; padding:5px 8px;
}
select:focus-visible{ outline:2px solid var(--acci); outline-offset:1px }
.save{ font-size:10px; letter-spacing:1.6px; color:var(--mute); min-width:52px;
  opacity:0; transition:opacity .4s; user-select:none }
.save.on{ opacity:1 }
.ver{ font-size:10px; letter-spacing:1.4px; color:var(--mute); opacity:.75;
  user-select:none; margin-inline-start:2px }
.page{ font-size:12.5px; color:var(--mute); min-width:46px; text-align:center;
  font-variant-numeric:tabular-nums }

/* ---------- board ---------- */
.stage{ flex:1 1 auto; display:grid; place-items:center; padding:14px; min-height:0 }
body.present .stage{ padding:0 }
.sheet{ position:relative; background:var(--paper); box-shadow:0 1px 0 var(--hair),0 8px 26px rgba(51,71,90,.07) }
body.present .sheet{ box-shadow:none }
body.present{ background:#fff }
body.present .stage{ background:#fff }
canvas{ display:block; touch-action:none; cursor:crosshair }

.hint{ position:absolute; inset-inline-start:0; bottom:-1px; width:100%;
  text-align:center; font-size:11px; color:var(--mute); pointer-events:none;
  opacity:0; transition:opacity .3s }
body.present .hint.show{ opacity:1 }

/* ---------- text tool ---------- */
#tin{
  position:absolute; font-family:var(--serif); background:transparent;
  border:none; border-bottom:1px solid var(--acci); outline:none;
  padding:0; margin:0; color:var(--ink); display:none; min-width:2ch;
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important } }
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="grp">
    <span class="lab">قلم</span>
    <button class="nib" id="n1" data-w="3"  aria-pressed="false" title="رفيع (1)"><i style="width:4px;height:4px"></i></button>
    <button class="nib" id="n2" data-w="6"  aria-pressed="true"  title="وسط (2)"><i style="width:7px;height:7px"></i></button>
    <button class="nib" id="n3" data-w="12" aria-pressed="false" title="عريض (3)"><i style="width:12px;height:12px"></i></button>
  </div>

  <div class="grp">
    <span class="lab">لون</span>
    <button class="sw" data-c="#2A3742" aria-pressed="true"  title="حبر"></button>
    <button class="sw" data-c="#5D8AA8" aria-pressed="false" title="أزرق — مطلوب منك شي هنا"></button>
    <button class="sw" data-c="#8A8377" aria-pressed="false" title="رمادي — ثانوي"></button>
  </div>

  <div class="grp">
    <button id="tPen"  aria-pressed="true"  title="قلم (P)">قلم</button>
    <button id="tText" aria-pressed="false" title="كتابة (T)">كتابة</button>
    <button id="tEr"   aria-pressed="false" title="ممحاة (E)">ممحاة</button>
  </div>

  <div class="grp">
    <span class="lab">صفحة</span>
    <button id="up" title="ارفع صفحة PDF أو صورة تشرح عليها">ارفع</button>
    <button id="rmbg" title="شيل الصفحة المرفوعة" disabled>شيل</button>
    <input id="file" type="file" accept="application/pdf,image/*" style="display:none">
  </div>

  <div class="grp">
    <span class="lab">الورقة</span>
    <select id="board" title="نوع الورقة">
      <option value="blank">فاضية</option>
      <option value="ruled">مسطرة</option>
      <option value="grid">مربعات</option>
      <option value="t2">حساب T — اثنين</option>
      <option value="t4">حساب T — أربعة</option>
      <option value="journal">دفتر اليومية</option>
      <option value="eq">المعادلة المحاسبية</option>
      <option value="tb">ميزان المراجعة</option>
    </select>
  </div>

  <div class="grp">
    <button id="undo" title="تراجع (Ctrl+Z)">تراجع</button>
    <button id="redo" title="إعادة (Ctrl+Shift+Z)">إعادة</button>
    <button id="clear" title="مسح الصفحة">مسح</button>
  </div>

  <div class="grp">
    <span class="lab">صفحة</span>
    <button id="prev" title="السابقة">‹</button>
    <span class="page" id="pnum">١ / ١</span>
    <button id="next" title="التالية">›</button>
    <button id="add" title="صفحة يديدة">+</button>
    <button id="fresh" title="سبورة يديدة — يمسح كل الصفحات">يديدة</button>
  </div>

  <div class="grp">
    <span class="lab">تكبير</span>
    <button id="zout" title="تصغير">&#8722;</button>
    <span class="page" id="znum">100%</span>
    <button id="zin" title="تكبير">+</button>
    <button id="zfit" title="ملء الورقة">ملء</button>
  </div>

  <div class="grp">
    <button id="png" title="تنزيل صورة">تنزيل</button>
    <button id="pres" title="عرض (F)">عرض</button>
    <span class="save" id="save"></span>
    <span class="ver">v3</span>
  </div>
</div>

<div class="stage" id="stage">
  <div class="sheet" id="sheet">
    <canvas id="cv"></canvas>
    <input id="tin" autocomplete="off" spellcheck="false">
    <div class="hint show" id="hint">Esc — رجوع للأدوات</div>
  </div>
</div>

<script>
"use strict";
const W = 1920, H = 1080;                 // إحداثيات ثابتة — الرسم ما يتغير مع حجم الشاشة
const M = { rule: 64, l: 116, r: 1856, t: 92, b: 1012 };
const C = { pri:'#33475A', acc:'#8FAFC6', acci:'#5D8AA8', ink:'#2A3742',
            line:'#A79C8A', hair:'#E1D8C9', thead:'#F2EDE3', mute:'#8A8377' };
const SERIF = "'Latin Modern Roman','Computer Modern Serif',Georgia,serif";
const ARFONT = "'Cairo','Segoe UI','Tahoma','Geeza Pro','DejaVu Sans',sans-serif";

const MARK_L = ["M582 -258H557C546 -156 532 -31 356 -31H274C227 -31 225 -38 225 -71V-604C225 -638 225 -652 320 -652H353V-683C317 -680 226 -680 185 -680C146 -680 68 -680 33 -683V-652H57C134 -652 136 -641 136 -605V-78C136 -42 134 -31 57 -31H33V0H554Z", "M1604 0V-31C1552 -31 1527 -31 1526 -61V-252C1526 -338 1526 -369 1495 -405C1481 -422 1448 -442 1390 -442C1317 -442 1270 -399 1242 -337V-442L1101 -431V-400C1171 -400 1179 -393 1179 -344V-76C1179 -31 1168 -31 1101 -31V0L1214 -3L1326 0V-31C1259 -31 1248 -31 1248 -76V-260C1248 -364 1319 -420 1383 -420C1446 -420 1457 -366 1457 -309V-76C1457 -31 1446 -31 1379 -31V0L1492 -3Z", "M1985 -128C1985 -181 1955 -211 1943 -223C1910 -255 1871 -263 1829 -271C1773 -282 1706 -295 1706 -353C1706 -388 1732 -429 1818 -429C1928 -429 1933 -339 1935 -308C1936 -299 1947 -299 1947 -299C1960 -299 1960 -304 1960 -323V-424C1960 -441 1960 -448 1949 -448C1944 -448 1942 -448 1929 -436C1926 -432 1916 -423 1912 -420C1874 -448 1833 -448 1818 -448C1696 -448 1658 -381 1658 -325C1658 -290 1674 -262 1701 -240C1733 -214 1761 -208 1833 -194C1855 -190 1937 -174 1937 -102C1937 -51 1902 -11 1824 -11C1740 -11 1704 -68 1685 -153C1682 -166 1681 -170 1671 -170C1658 -170 1658 -163 1658 -145V-13C1658 4 1658 11 1669 11C1674 11 1675 10 1694 -9C1696 -11 1696 -13 1714 -32C1758 10 1803 11 1824 11C1939 11 1985 -56 1985 -128Z"];
const MARK_E = ["M 664.5,-215.5 Q 847.0,-485.5 1029.5,-215.5", "M 664.5,-215.5 Q 810.5,0.5 956.5,-129.1", "M 664.5,-215.5 L 1029.5,-215.5"];
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let g = ctx;                       // سياق الرسم الحالي (الشاشة أو التصدير)
const sheet = document.getElementById('sheet');
const stage = document.getElementById('stage');
const tin = document.getElementById('tin');

let pages = [ newPage() ];
let cur = 0;
let tool = 'pen', color = C.ink, width = 6;
let drawing = null, dpr = 1, scale = 1;
let view = { k:1, x:0, y:0 };
function clampView(){
  view.k = Math.min(6, Math.max(1, view.k));
  view.x = Math.min(0, Math.max(W*(1-view.k), view.x));
  view.y = Math.min(0, Math.max(H*(1-view.k), view.y));
}
function zoomAt(nk, cx, cy){
  const ok=view.k; nk=Math.min(6,Math.max(1,nk));
  view.x = cx - (cx-view.x)*(nk/ok);
  view.y = cy - (cy-view.y)*(nk/ok);
  view.k = nk; clampView(); draw(); zsync();
}
function zsync(){ const z=document.getElementById('znum');
  if(z) z.textContent = Math.round(view.k*100)+'%'; }

function newPage(){ return { board:'blank', bg:null, items:[], undone:[] }; }
function P(){ return pages[cur]; }

/* ---------- fit ---------- */
function fit(){
  const pad = document.body.classList.contains('present') ? 0 : 28;
  const aw = stage.clientWidth - pad, ah = stage.clientHeight - pad;
  scale = Math.min(aw / W, ah / H);
  const w = Math.round(W * scale), h = Math.round(H * scale);
  sheet.style.width = w + 'px'; sheet.style.height = h + 'px';
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  draw();
}
window.addEventListener('resize', fit);

/* ---------- board backgrounds ---------- */
function line(x1,y1,x2,y2,col,w){
  g.strokeStyle=col; g.lineWidth=w; g.beginPath();
  g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
}
const isAR = t => /[\u0600-\u06FF]/.test(t);
function label(t,x,y,size,col,align){
  g.direction='ltr';
  g.fillStyle=col; g.font = size+'px '+SERIF;
  g.textAlign = align||'center'; g.textBaseline='alphabetic';
  g.fillText(t,x,y); g.textAlign='start';
}
const boards = {
  blank(){},
  ruled(){ for(let y=M.t+56; y<=M.b; y+=68) line(M.l,y,M.r,y,C.hair,1.5); },
  grid(){
    for(let x=M.l; x<=M.r; x+=60) line(x,M.t,x,M.b,'#EFE9DC',1);
    for(let y=M.t; y<=M.b; y+=60) line(M.l,y,M.r,y,'#EFE9DC',1);
  },
  t2(){ const w=810,gap=120,y=M.t+130,hh=760;
        tacc(M.l,y,w,hh); tacc(M.l+w+gap,y,w,hh); },
  t4(){ const w=780,gap=180,hh=350;
        const xs=[M.l,M.l+w+gap], ys=[M.t+96,M.t+560];
        for(const yy of ys) for(const xx of xs) tacc(xx,yy,w,hh); },
  journal(){
    const x=M.l, y=M.t+40, w=M.r-M.l, rows=13, rh=64;
    const cols=[0,180,w-560,w-460,w-230,w];
    g.fillStyle=C.thead; g.fillRect(x,y,w,54);
    line(x,y,x+w,y,C.line,2); line(x,y+54,x+w,y+54,C.line,2);
    const heads=['Date','Account Titles and Explanation','Ref.','Debit','Credit'];
    for(let i=0;i<5;i++) label(heads[i], x+(cols[i]+cols[i+1])/2, y+36, 24, C.pri);
    for(let r=1;r<=rows;r++) line(x,y+54+r*rh,x+w,y+54+r*rh,C.hair,1.2);
    for(const c of cols) line(x+c,y,x+c,y+54+rows*rh,C.line,1.6);
    line(x,y+54+rows*rh,x+w,y+54+rows*rh,C.line,2);
  },
  eq(){
    const y=M.t+110, h=740, gap=64;
    const bw=(M.r-M.l-2*gap)/3;
    const names=['Assets','Liabilities','Equity'];
    const signs=['=','+'];
    for(let i=0;i<3;i++){
      const x=M.l+i*(bw+gap);
      g.fillStyle=C.thead; g.fillRect(x,y,bw,52);
      g.strokeStyle=C.line; g.lineWidth=1.6; g.strokeRect(x,y,bw,h);
      line(x,y+52,x+bw,y+52,C.line,1.6);
      label(names[i], x+bw/2, y+36, 26, C.pri);
      if(i<2) label(signs[i], x+bw+gap/2, y+h/2+16, 46, C.acci);
    }
  },
  tb(){
    const x=M.l+200, w=M.r-M.l-400, y=M.t+90, rows=12, rh=64;
    const cols=[0,w-460,w-230,w];
    g.fillStyle=C.thead; g.fillRect(x,y,w,54);
    line(x,y,x+w,y,C.line,2); line(x,y+54,x+w,y+54,C.line,2);
    const heads=['Account','Debit','Credit'];
    for(let i=0;i<3;i++) label(heads[i], x+(cols[i]+cols[i+1])/2, y+36, 24, C.pri);
    for(let r=1;r<=rows;r++) line(x,y+54+r*rh,x+w,y+54+r*rh,C.hair,1.2);
    for(const c of cols) line(x+c,y,x+c,y+54+rows*rh,C.line,1.6);
    const yb=y+54+rows*rh;
    line(x,yb,x+w,yb,C.line,2); line(x,yb+5,x+w,yb+5,C.line,2);   // إجمالي مزدوج
    label('Trial Balance', (M.l+M.r)/2, y-32, 28, C.mute);
  }
};
function tacc(x,y,w,h){
  line(x,y,x+w,y,C.line,2.2);                // اسم الحساب فوق هذا الخط
  line(x+w/2,y,x+w/2,y+h,C.line,2.2);
  label('Dr.', x+w/4, y+34, 21, C.mute);
  label('Cr.', x+3*w/4, y+34, 21, C.mute);
}

/* ---------- render ---------- */
function draw(){
  g = ctx;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,cv.width,cv.height);
  g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
  const s = (cv.width / W);
  g.setTransform(s,0,0,s,0,0);
  g.transform(view.k,0,0,view.k, view.x, view.y);
  g.lineJoin='round'; g.lineCap='round';
  bgimg();
  (boards[P().board] || boards.blank)();
  line(M.rule, 52, M.rule, H-52, C.acc, 1.4);        // خط الهامش — البصمة
  wordmark();
  for(const it of P().items) paint(it);
}
const imgCache=new Map();
function bgimg(){
  const src=P().bg; if(!src) return;
  let im=imgCache.get(src);
  if(!im){ im=new Image(); im.onload=()=>draw(); im.src=src; imgCache.set(src,im); return; }
  if(!im.complete || !im.naturalWidth) return;
  const k=Math.min((W-2*M.rule-40)/im.naturalWidth, (H-80)/im.naturalHeight);
  const w=im.naturalWidth*k, hh=im.naturalHeight*k;
  g.drawImage(im, (W-w)/2 + M.rule/2, (H-hh)/2, w, hh);
}
function wordmark(){
  const w=124, k=w/2019, x=M.r-w, y=100;
  g.save(); g.translate(x,y); g.scale(k,k);
  g.fillStyle=C.pri;
  for(const d of MARK_L) g.fill(new Path2D(d));
  g.strokeStyle=C.acci; g.lineWidth=55; g.lineCap='round';
  for(const d of MARK_E) g.stroke(new Path2D(d));
  g.restore();
}
function paint(it){
  if(it.k==='t'){
    g.direction = it.rtl ? 'rtl' : 'ltr';
    g.fillStyle=it.c; g.font=it.s+'px '+(it.rtl?ARFONT:SERIF);
    g.textAlign='start'; g.textBaseline='alphabetic';
    g.fillText(it.txt, it.x, it.y);
    g.direction='ltr'; return;
  }
  const p=it.p; if(!p.length) return;
  g.strokeStyle=it.c; g.lineWidth=it.w;
  g.beginPath();
  if(p.length<3){ g.moveTo(p[0][0],p[0][1]); g.lineTo(p[p.length-1][0],p[p.length-1][1]); }
  else{
    g.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<p.length-1;i++){
      const mx=(p[i][0]+p[i+1][0])/2, my=(p[i][1]+p[i+1][1])/2;
      g.quadraticCurveTo(p[i][0],p[i][1],mx,my);
    }
    g.lineTo(p[p.length-1][0],p[p.length-1][1]);
  }
  g.stroke();
}

/* ---------- input ---------- */
function raw(e){
  const r=cv.getBoundingClientRect();
  return [ (e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H ];
}
function pt(e){ const L=raw(e); return [ (L[0]-view.x)/view.k, (L[1]-view.y)/view.k ]; }
let penSeen=false;
const touches=new Map();
let gesture=null;
function ignore(e){
  if(e.pointerType==='pen'){ penSeen=true; return false; }
  if(e.pointerType!=='touch') return false;
  if(penSeen) return true;          // راحة اليد بعد ما يمسك القلم
  return touches.size>1 || !!gesture;  // إصبعان = إيماءة مو رسم
}
function cancelStroke(){
  if(!drawing) return;
  if(!drawing.er){ const i=P().items.lastIndexOf(drawing); if(i>=0) P().items.splice(i,1); }
  drawing=null; draw(); sync();
}
function gestureStart(){
  const [a,b]=[...touches.values()];
  gesture={ d:Math.hypot(a[0]-b[0],a[1]-b[1]),
            c:[(a[0]+b[0])/2,(a[1]+b[1])/2], k:view.k, x:view.x, y:view.y };
  cancelStroke();
}
function gestureMove(){
  if(!gesture || touches.size<2) return;
  const [a,b]=[...touches.values()];
  const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  const c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  if(gesture.d<1) return;
  const nk=Math.min(6, Math.max(1, gesture.k * (d/gesture.d)));
  const r=nk/gesture.k;
  view.k=nk;
  view.x = c[0] - (gesture.c[0]-gesture.x)*r;
  view.y = c[1] - (gesture.c[1]-gesture.y)*r;
  clampView(); draw(); zsync();
}
cv.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch'){          // نتتبع الأصابع دايماً — حتى مع القلم — عشان التكبير
    touches.set(e.pointerId, raw(e));
    if(touches.size===2){ gestureStart(); return; }
    if(touches.size>2) return;
  }
  if(ignore(e)) return;
  if(tool==='text'){ commitText(); openText(pt(e)); return; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(tool==='eraser'){ drawing={er:true}; erase(pt(e)); return; }
  drawing={ k:'s', c:color, w:width, p:[pt(e)] };
  P().items.push(drawing); P().undone.length=0; sync();
});
cv.addEventListener('pointermove', e=>{
  if(e.pointerType==='touch' && touches.has(e.pointerId)){
    touches.set(e.pointerId, raw(e));
    if(gesture){ gestureMove(); return; }
  }
  if(!drawing || ignore(e)) return;
  if(drawing.er){ erase(pt(e)); return; }
  const q=pt(e), last=drawing.p[drawing.p.length-1];
  if(Math.hypot(q[0]-last[0], q[1]-last[1]) < 1.6) return;
  drawing.p.push(q); draw();
});
function stop(e){
  if(e && e.pointerType==='touch'){
    touches.delete(e.pointerId);
    if(touches.size<2 && gesture){ gesture=null; }
  }
  drawing=null;
}
cv.addEventListener('touchmove', e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
cv.addEventListener('pointerleave', stop);

function erase(q){
  const r=26+width*1.6; let hit=false;
  const keep=P().items.filter(it=>{
    if(it.k==='t'){
      const wpx=it.txt.length*it.s*0.55;
      const x0 = it.rtl ? it.x-wpx : it.x-8, x1 = it.rtl ? it.x+8 : it.x+wpx;
      const in_ = q[0]>x0 && q[0]<x1 && q[1]<it.y+10 && q[1]>it.y-it.s;
      if(in_) hit=true; return !in_;
    }
    for(const p of it.p){ if(Math.hypot(p[0]-q[0],p[1]-q[1])<r){ hit=true; return false; } }
    return true;
  });
  if(hit){ P().items=keep; P().undone.length=0; draw(); sync(); }
}

/* ---------- text ---------- */
let tpos=null, tOpen=false;
function openText(q){
  tpos=q; tOpen=true;
  const r=cv.getBoundingClientRect(), f=r.width/W;
  const size=Math.max(26, width*4.5);
  tin.style.display='block';
  tin.style.insetInlineStart='';
  tin.style.left=(q[0]*f)+'px';
  tin.style.top=((q[1]-size)*f)+'px';
  tin.style.fontSize=(size*f)+'px';
  tin.style.color=color;
  tin.dir='auto'; tin.value='';
  tin.dataset.size=size;
  setTimeout(()=>tin.focus(),0);
}
function commitText(){
  if(!tOpen) return;
  tOpen=false;
  const v=tin.value.trim();
  tin.style.display='none';
  if(v && tpos){
    P().items.push({k:'t', txt:v, x:tpos[0], y:tpos[1], c:color,
                    s:+tin.dataset.size, rtl:isAR(v)});
    P().undone.length=0; draw(); sync();
  }
  tpos=null;
}
tin.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); commitText(); }
  else if(e.key==='Escape'){ e.preventDefault(); tOpen=false; tin.style.display='none'; tpos=null; }
  e.stopPropagation();
});

/* ---------- chrome wiring ---------- */
function press(nodes, active){ nodes.forEach(n=> n.setAttribute('aria-pressed', n===active)); }
const nibs=[...document.querySelectorAll('.nib')];
nibs.forEach(b=> b.onclick=()=>{ width=+b.dataset.w; press(nibs,b); setTool('pen'); });
const sws=[...document.querySelectorAll('.sw')];
sws.forEach(b=>{ b.style.background=b.dataset.c;
  b.onclick=()=>{ color=b.dataset.c; press(sws,b); }; });

const tools={ pen:document.getElementById('tPen'), text:document.getElementById('tText'),
              eraser:document.getElementById('tEr') };
function setTool(t){
  commitText();
  tool=t; press(Object.values(tools), tools[t]);
  cv.style.cursor = t==='eraser' ? 'cell' : (t==='text' ? 'text' : 'crosshair');
}
tools.pen.onclick=()=>setTool('pen');
tools.text.onclick=()=>setTool('text');
tools.eraser.onclick=()=>setTool('eraser');

const boardSel=document.getElementById('board');
boardSel.onchange=()=>{ commitText(); P().board=boardSel.value; draw(); persist(); };

const undoB=document.getElementById('undo'), redoB=document.getElementById('redo');
undoB.onclick=()=>{ const it=P().items.pop(); if(it){ P().undone.push(it); draw(); sync(); } };
redoB.onclick=()=>{ const it=P().undone.pop(); if(it){ P().items.push(it); draw(); sync(); } };
document.getElementById('clear').onclick=()=>{
  if(!P().items.length) return;
  P().undone=P().items.slice().reverse(); P().items=[]; draw(); sync();
};

const pnum=document.getElementById('pnum');
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function go(i){ commitText(); cur=Math.max(0,Math.min(pages.length-1,i)); boardSel.value=P().board; draw(); sync(); }
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('add').onclick=()=>{
  const b=P().board; pages.splice(cur+1,0,newPage()); pages[cur+1].board=b; go(cur+1);
};
function sync(){
  persist();
  pnum.textContent = AR(cur+1)+' / '+AR(pages.length);
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===pages.length-1;
  rmbg.disabled = !P().bg;
  undoB.disabled = !P().items.length;
  redoB.disabled = !P().undone.length;
}

document.getElementById('png').onclick=()=>{
  const o=document.createElement('canvas'); o.width=W*2; o.height=H*2;
  const og=o.getContext('2d');
  const prev=g, pv={...view}; view={k:1,x:0,y:0};
  g=og; g.setTransform(2,0,0,2,0,0);
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.lineJoin='round'; g.lineCap='round';
  bgimg();
  (boards[P().board]||boards.blank)();
  line(M.rule,52,M.rule,H-52,C.acc,1.4);
  wordmark();
  for(const it of P().items) paint(it);
  g=prev; view=pv;
  o.toBlob(bl=>{
    const url=URL.createObjectURL(bl);
    const a=document.createElement('a');
    a.download='lens-board-'+(cur+1)+'.png'; a.href=url;
    if('download' in a){ a.click(); } else { window.open(url,'_blank'); }
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
};

/* ---------- رفع صفحة ---------- */
const fileIn=document.getElementById('file'), rmbg=document.getElementById('rmbg');
document.getElementById('up').onclick=()=>fileIn.click();
rmbg.onclick=()=>{ P().bg=null; draw(); sync(); };

function shrink(canvas){
  const maxW=1700, k=Math.min(1, maxW/canvas.width);
  if(k<1){ const c2=document.createElement('canvas');
    c2.width=Math.round(canvas.width*k); c2.height=Math.round(canvas.height*k);
    c2.getContext('2d').drawImage(canvas,0,0,c2.width,c2.height); canvas=c2; }
  return canvas.toDataURL('image/jpeg', 0.78);
}

let pdfjs=null;
function loadPdfJs(){
  if(pdfjs) return Promise.resolve(pdfjs);
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ const L=window.pdfjsLib;
      if(!L) return rej(new Error('no lib'));
      L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      pdfjs=L; res(L); };
    s.onerror=()=>rej(new Error('offline'));
    document.head.appendChild(s);
  });
}

fileIn.onchange=async()=>{
  const f=fileIn.files && fileIn.files[0]; if(!f) return;
  fileIn.value='';
  try{
    if(f.type.startsWith('image/')){
      const url=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(f); });
      P().bg=url; P().board='blank'; boardSel.value='blank'; draw(); sync(); flag('انضافت');
      return;
    }
    flag('يحمّل…');
    const L=await loadPdfJs();
    const buf=await f.arrayBuffer();
    const doc=await L.getDocument({data:buf}).promise;
    const ans=prompt('صفحات المستند '+doc.numPages+'. أي صفحة تبي؟ (مثال: 3 أو 3-6)','1');
    if(ans===null) return;
    let a=1,b=1;
    const m=String(ans).trim().match(/^(\d+)\s*(?:-\s*(\d+))?$/);
    if(!m){ flag('رقم غلط'); return; }
    a=+m[1]; b=m[2]?+m[2]:a;
    a=Math.max(1,Math.min(doc.numPages,a)); b=Math.max(a,Math.min(doc.numPages,b));
    if(b-a>29){ b=a+29; }
    let first=true;
    for(let n=a;n<=b;n++){
      const pageObj=await doc.getPage(n);
      const vp0=pageObj.getViewport({scale:1});
      const sc=Math.min(1700/vp0.width, 2400/vp0.height, 3);
      const vp=pageObj.getViewport({scale:sc});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      const cg=c.getContext('2d'); cg.fillStyle='#fff'; cg.fillRect(0,0,c.width,c.height);
      await pageObj.render({canvasContext:cg, viewport:vp}).promise;
      const url=shrink(c);
      if(first){ first=false; } else { pages.splice(++cur,0,newPage()); }
      P().bg=url; P().board='blank';
      flag('صفحة '+n);
    }
    boardSel.value='blank'; draw(); sync(); flag('تمت');
  }catch(err){
    flag(err && err.message==='offline' ? 'يبي إنترنت' : 'ما زبطت');
    alert(err && err.message==='offline'
      ? 'قراءة PDF تحتاج إنترنت أول مرة فقط. إذا ما عندك اتصال، حوّل الصفحة لصورة PNG وارفعها.'
      : 'ما قدرت أقرا الملف. جرّب ترفعه كصورة PNG.');
  }
};

document.getElementById('zin').onclick =()=>zoomAt(view.k*1.35, W/2, H/2);
document.getElementById('zout').onclick=()=>zoomAt(view.k/1.35, W/2, H/2);
document.getElementById('zfit').onclick=()=>{ view={k:1,x:0,y:0}; draw(); zsync(); };

document.getElementById('pres').onclick=togglePresent;
function togglePresent(){
  document.body.classList.toggle('present');
  const on=document.body.classList.contains('present');
  if(on){ document.getElementById('hint').classList.add('show');
          setTimeout(()=>document.getElementById('hint').classList.remove('show'),2600); }
  fit();
}

window.addEventListener('keydown', e=>{
  if(e.target===tin) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); (e.shiftKey?redoB:undoB).click(); return; }
  if(k==='escape' && document.body.classList.contains('present')){ togglePresent(); return; }
  if(k==='1'){ nibs[0].click(); } else if(k==='2'){ nibs[1].click(); } else if(k==='3'){ nibs[2].click(); }
  else if(k==='p'){ setTool('pen'); } else if(k==='t'){ setTool('text'); } else if(k==='e'){ setTool('eraser'); }
  else if(k==='f'){ togglePresent(); }
  else if(e.key==='ArrowRight'){ go(cur-1); } else if(e.key==='ArrowLeft'){ go(cur+1); }
});


/* ---------- الحفظ التلقائي ---------- */
const KEY='lens-board-v1';
const Store=(()=>{
  try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k);
       return { ok:true,
         get:async()=>localStorage.getItem(KEY),
         set:async v=>localStorage.setItem(KEY,v),
         del:async()=>localStorage.removeItem(KEY) }; }catch(e){}
  if(window.storage) return { ok:true,
    get:async()=>{ try{ const r=await window.storage.get(KEY); return r?r.value:null; }catch(e){ return null; } },
    set:async v=>{ try{ await window.storage.set(KEY,v); }catch(e){} },
    del:async()=>{ try{ await window.storage.delete(KEY); }catch(e){} } };
  return { ok:false, get:async()=>null, set:async()=>{}, del:async()=>{} };
})();

const saveTag=document.getElementById('save');
function flag(t){ saveTag.textContent=t; saveTag.classList.add('on');
  clearTimeout(flag._t); flag._t=setTimeout(()=>saveTag.classList.remove('on'),1400); }

const r1=n=>Math.round(n*10)/10;
function pack(){
  return JSON.stringify({ v:1, cur, pages: pages.map(p=>({
    b:p.board, g:p.bg||null,
    i:p.items.map(it=> it.k==='t'
        ? {k:'t',t:it.txt,x:r1(it.x),y:r1(it.y),c:it.c,s:it.s,r:it.rtl?1:0}
        : {c:it.c,w:it.w,p:it.p.map(q=>[r1(q[0]),r1(q[1])])} )
  }))});
}
function unpack(s){
  const d=JSON.parse(s); if(!d||!d.pages||!d.pages.length) return false;
  pages=d.pages.map(p=>({ board:p.b||'blank', bg:p.g||null, undone:[],
    items:(p.i||[]).map(it=> it.k==='t'
      ? {k:'t',txt:it.t,x:it.x,y:it.y,c:it.c,s:it.s,rtl:!!it.r}
      : {c:it.c,w:it.w,p:it.p}) }));
  cur=Math.min(d.cur||0, pages.length-1);
  return true;
}
let saveT=null;
function persist(){
  if(!Store.ok) return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{ await Store.set(pack()); flag('محفوظة'); }
    catch(e){ flag(/quota|exceed/i.test(String(e && e.name)+String(e && e.message))
      ? 'الذاكرة امتلت' : 'ما انحفظت'); }
  }, 700);
}
async function restore(){
  if(!Store.ok){ flag('بلا حفظ'); return; }
  try{ const s=await Store.get(); if(s && unpack(s)){
        boardSel.value=P().board; draw(); sync(); flag('رجعت'); } }catch(e){}
}
window.addEventListener('beforeunload',()=>{ if(Store.ok){ try{ Store.set(pack()); }catch(e){} } });

document.getElementById('fresh').onclick=async()=>{
  if(!confirm('تمسح كل الصفحات وتبدأ سبورة يديدة؟')) return;
  pages=[newPage()]; cur=0; boardSel.value='blank';
  await Store.del(); draw(); sync(); flag('يديدة');
};

fit(); sync(); zsync(); restore();
</script>
